<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="../Base.js"></script>
    <title>作業平台</title>
</head>
<body>
    <table width="100%" border="0" cellspacing="0" cellpadding="0">
        <tbody>
            <tr>
                <td>
                    <span class="c14k"><strong name="titleShow">應收帳款-催收</strong></span>
                </td>
                <td class="c12-k" align="right">
                    <a style="cursor: pointer;" onclick="javascript: void window.open(`${BASE_AE_WEB}/House_M/RC_D_daily.asp`,'_RC_D_daily','scrollbars=yes,resizable=yes,top=50,left=100,width=1050,height=750');">
                        <font color="#0000FF">【每日未沖銷清單】</font>
                    </a>
                    &nbsp;&nbsp;
                    <a style="cursor: pointer;" onclick="javascript:void window.open(`${BASE_AE_WEB}/House_M/RC_D_daily_debt.asp`,'_RC_D_daily_debt','scrollbars=yes,resizable=yes,top=50,left=100,width=1050,height=750');">
                        <font color="#0000FF">【呆帳清單】</font>
                    </a>
                </td>
            </tr>
            <tr>
                <td height="24">
                    客戶:<input type="text" name="name" width="25" />
                    本期繳款日：<input type="text" class="datepickerTW" name="str_Date_S" /> ~ <input type="text" class="datepickerTW" name="str_Date_E" />
                    <input type="radio" name="caseType" value="Engine">機車貸款
                    <input type="radio" name="caseType" value="Automobile">汽車貸款
                    <input type="radio" name="caseType" value="House">房屋貸款
                    <input type="button" value="查詢" onclick="fetchData(); ">
                </td>
            </tr>
            <tr>
                <td>
                    <label>逾期天數：</label>
                    <input type="checkbox" name="check_Day0" id="check_Day0" value="Y">1~30天
                    <input type="checkbox" name="check_DayA" id="check_DayA" value="Y">31~60天
                    <input type="checkbox" name="check_DayB" id="check_DayB" value="Y">61~90天
                    <input type="checkbox" name="check_DayC" id="check_DayC" value="Y">91天以上
                </td>

            </tr>
        </tbody>
    </table>
    <br />
    <table id="MainTable" width="100%" border="0" cellpadding="4" cellspacing="1" bgcolor="#666666" style="font-size:13px;">
        <thead>
            <tr align="center" height="30" bgcolor="#CCCCFF" class="c12-k">
                <td>序</td>
                <td>所屬</td>
                <td>業務人員</td>
                <td>專案名稱</td>
                <td>客戶姓名</td>
                <td>總金額</td>
                <td>期數</td>
                <td>第幾期</td>
                <td>本期繳款日</td>
                <td>逾期天數</td>
                <td>月付金</td>
                <td>利息</td>
                <td>償還本金</td>
                <td>本金餘額</td>
                <td>催收備註</td>
                <td>法拍狀態</td>
                <td>修改</td>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr align="center" height="15" bgcolor="#CCCCFF">
                <td class="c12-k" colspan="17">
                    <font color="#000080">
                        <label id="CountRows"></label>
                    </font>
                </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
<script>
    const Params = getQueryParams();
    let WebUser = Params.WebUser;
    let WebBC = Params.WebBC;
    let data = [];
    

    dateTW();
    $('.datepickerTW').datepickerTW({
        changeYear: true,
        changeMonth: true,
        dateFormat: 'yy-mm-dd'
    });

    $(document).ready(function () {
        const today = new Date();

        function toROCDateString(date) {
            const rocYear = date.getFullYear() - 1911;
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${rocYear}-${month}-${day}`;
        }

        const todayStr = toROCDateString(today);

        const past = new Date(today);
        past.setDate(1); 
        past.setFullYear(past.getFullYear() - 8);
        past.setMonth(past.getMonth() - 2);

        // 還原為目標月份可用的日期
        const lastDay = new Date(
            past.getFullYear(),
            past.getMonth() + 1,
            0
        ).getDate();

        past.setDate(Math.min(today.getDate(), lastDay));

        const pastStr = toROCDateString(past);

        $('input[name="str_Date_S"]').val(pastStr);
        $('input[name="str_Date_E"]').val(todayStr);

        fetchData();
    });

    function fetchData() {
        const requestData = {
            name: document.querySelector('input[name="name"]').value,
            str_Date_S: document.querySelector('input[name="str_Date_S"]').value,
            str_Date_E: document.querySelector('input[name="str_Date_E"]').value,
            caseType: document.querySelector('input[name="caseType"]:checked')?.value || '',
            check_Day0: document.querySelector('input[name="check_Day0"]').checked ? 'Y' : '',
            check_DayA: document.querySelector('input[name="check_DayA"]').checked ? 'Y' : '',
            check_DayB: document.querySelector('input[name="check_DayB"]').checked ? 'Y' : '',
            check_DayC: document.querySelector('input[name="check_DayC"]').checked ? 'Y' : '',
        };

        const url = `${BASE_URL}/AE_ACC/RC_D_Coll_LQuery`;
        document.body.style.cursor = 'wait';
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(requestData)
        })
            .then(response => response.json())
            .then(responseData => {
                if (responseData.resultCode == "000") {
                    data = JSON.parse(responseData.objResult);
                    showTable();
                } else {
                    const tbody = document.querySelector('#MainTable tbody');
                    tbody.innerHTML = '';
                    alert(responseData.resultMsg);
                }
            })
            .catch(error => {
                alert('API 請求失敗:', error);
            })
            .finally(() => {
                document.body.style.cursor = 'default';
            });
    }

    function showTable() {
        document.getElementById('CountRows').innerHTML = `筆數:${data.length}`;
        const tbody = document.querySelector('#MainTable tbody');
        tbody.innerHTML = '';

        const columnOrder = ['U_BC_name', 'plan_name', 'project_name', 'CS_name', 'amount_total', 'month_total', 'RC_count', 'RC_date', 'DiffDay', 'RC_amount', 'interest', 'Rmoney', 'Ex_RemainingPrincipal', 'disExpe_note', 'AS_Name', 'RCM_id'];
        data.forEach((item, index) => {
            const row = document.createElement('tr');
            row.setAttribute('align', 'center');
            row.className = 'c12-k';
            row.style.backgroundColor = '#FFFFFF';
            row.onmouseover = function () { this.style.background = '#FCFCC0'; };
            row.onmouseout = function () { this.style.background = '#FFFFFF'; };

            const serialCell = document.createElement('td');
            serialCell.textContent = index + 1;  // 序號
            row.appendChild(serialCell);

            columnOrder.forEach(key => {
                const cell = document.createElement('td');
                switch (key) {
                    case "amount_total":
                    case "RC_amount":
                    case "interest":
                    case "Rmoney":
                    case "Ex_RemainingPrincipal":
                        cell.innerHTML = item[key].toLocaleString();
                        row.appendChild(cell);
                        break;
                    case "disExpe_note":
                        cell.innerHTML = item[key];
                        cell.style.textAlign = 'left';    
                        cell.style.whiteSpace = 'normal';   
                        row.appendChild(cell);
                        break;
                    case "RCM_id": {
                        const link = document.createElement('a');
                        link.href = '#';
                        link.textContent = '修改';
                        link.style.whiteSpace = 'nowrap';
                        link.style.display = 'inline-block';
                        link.style.color = 'blue';
                        link.style.textDecoration = 'underline';
                        link.style.cursor = 'pointer';

                        link.addEventListener('click', function (e) {
                            e.preventDefault();
                            const rcmId = item[key];
                            const url = `Coll_SP_Detail.html?RCM_id=${encodeURIComponent(rcmId) }&WebUser=${WebUser}`;
                            window.open(url, '_blank', 'width=800,height=300');
                        });
                        cell.appendChild(link);
                        cell.style.textAlign = 'left';
                        row.appendChild(cell);
                        break;
                    }
                    default:
                        cell.textContent = item[key];
                        row.appendChild(cell);
                        break;
                }
            });
            tbody.appendChild(row);
        });
    }
</script>
