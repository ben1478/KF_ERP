<script>
	const Params = getQueryParams();
    let WebUser = Params.WebUser;

	window.onload = function () {
		 loadYYYYMM({
            selectId: "YYYYMM"
        });	
		
	}

	
    function loadYYYYMM({ selectId}) {
        const url = `${BASE_URL}/AE_ACC/Getlottery_Mon`;
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.resultCode === "000") {
                    const selectElement = document.getElementById(selectId);
                    const options = JSON.parse(data.objResult);
                   
                    options.forEach(option => {
                        const optionElement = document.createElement('option');
                        optionElement.value = option.lottery_mon;
                        optionElement.textContent = option.lottery_Desc;
                        selectElement.appendChild(optionElement);
                    });
					fetchData();
                } else {
                    alert('錯誤: ' + (data.resultMsg || '未知錯誤'));
                }
            })
            .catch(error => {
                console.error(`載入選項出錯:`, error);
                alert('無法載入資料，請稍後再試。');
            });
    }

    function fetchData() {
        let YYYY = document.getElementById('YYYYMM').value.substring(0,4)
		let MM = document.getElementById('YYYYMM').value.substring(5)
        const url = `${BASE_URL}/AE_ACC/GetInvoice_prize?YYYY=${YYYY}&MM=${MM}`;
		
        fetch(url, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => response.json())
            .then(responseData => {
                if (responseData.resultCode == "000") {
                    data = JSON.parse(responseData.objResult);
					 if (data.ResultCode == "000") {
						showPage(JSON.parse(data.objResult));
					}
                } else {
                    alert(response.resultMsg);
                }
            })
            .catch(error => {
				console.log(`API 請求失敗: error=${error}`);
                alert('API 請求失敗:', error);
            });
    }

   
	function showPage(page) {
        const tbody = document.querySelector('#MainTable tbody');
        tbody.innerHTML = '';

        for (let item of page) {
            const row = document.createElement('tr');
            row.setAttribute('align', 'center');
            row.setAttribute('class', 'c12-k');
            row.setAttribute('bgcolor', '#FFFFFF');
            row.setAttribute('onmouseover', "this.style.background='#FCFCC0';");
            row.setAttribute('onmouseout', "this.style.background='#FFFFFF';");

            const columnOrder = ['yyyymmdd', 'invoice_no', 'prize_name', 'prize_amount', 'CS_name', 'CS_MTEL1', 'CS_address'];
			
			const serialCell = document.createElement('td');
            serialCell.textContent =  page.indexOf(item) + 1;
            row.appendChild(serialCell);
            
			for (let key of columnOrder) 
			{
				const cell = document.createElement('td');
				switch (key) 
				{
					case 'CS_address':
						cell.innerHTML = item[key] || '';
						cell.style.textAlign = 'left'; // 設定文字靠左
						row.appendChild(cell);
						break;
					default:
                        cell.textContent = item[key] || '';
                        row.appendChild(cell);
                }
             }
            
            tbody.appendChild(row);
        }
    }


function GetLotteryTable(YYYY = "", MM = "") {
	if(YYYY=='')
	{
		YYYY=document.getElementById('YYYYMM').value.substring(0,4)
		MM=document.getElementById('YYYYMM').value.substring(5)
	}
    const url = `${BASE_URL}/AE_ACC/GetLotteryTable?YYYY=${YYYY}&MM=${MM}`;
    fetch(url)
        .then(response => response.json())
        .then(responseData => {
            if (responseData.ResultCode === "000" || responseData.resultCode === "000") {
                const dataObj = typeof responseData.objResult === "string" 
                    ? JSON.parse(responseData.objResult) 
                    : (responseData.objResult || responseData);

                const lotteryList = dataObj.lotteryList || [];
                const lislottery_YM = dataObj.lislottery_YM || [];

                let currentYYYY = YYYY;
                let currentMM = MM;

                // 若未傳入年月，直接在資料端取得最大值解析
                if (!currentYYYY || !currentMM) {
                    const ymStrings = lislottery_YM.map(item => (item && item.lottery_YM) ? item.lottery_YM : item).filter(Boolean);
                    if (ymStrings.length > 0) {
                        const maxYM = ymStrings.sort()[ymStrings.length - 1]; // 取最大/最新的期別
                        const parts = maxYM.split('-');
                        currentYYYY = parts[0] || "";
                        currentMM = parts[1] || "";
                    }
                }

                // 傳入已經決定好的 currentYYYY 與 currentMM
                OpenSetting(lotteryList, lislottery_YM, currentYYYY, currentMM);
            } else {
                alert("查詢失敗：" + (responseData.ResultMessage || "未知錯誤"));
            }
        }).catch(error => {
            console.error('載入開獎設定時出錯:', error);
        });
}


function formatLotteryPeriodTitle(yyyy, mm) {
    if (!yyyy || !mm) return "統一發票中獎號碼單";
    
    var startMonth = parseInt(mm, 10);
    var endMonth = startMonth + 1;
    
    // 補零顯示 (例: 3 -> 03, 4 -> 04)
    var startStr = startMonth.toString().padStart(2, '0');
    var endStr = endMonth.toString().padStart(2, '0');
    
    return `${yyyy-1911}年 ${startStr}-${endStr}月 統一發票中獎號碼單`;
}

// 輔助函式：計算下一期 (雙月制：01 -> 03 -> 05 -> 07 -> 09 -> 11 -> 次年01)
function getNextPeriod(yyyy, mm) {
    let year = parseInt(yyyy, 10);
    let month = parseInt(mm, 10);

    if (month >= 11) {
        year += 1;
        month = 1;
    } else {
        month += 2;
    }

    return {
        yyyy: year.toString(),
        mm: month.toString().padStart(2, '0')
    };
}

            <div style="text-align: right; margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px;">
                <button type="button" onclick="GetLotteryTable('${latestYYYY}', '${latestMM}')" 
                        style="padding: 6px 14px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer;">
                    返回
                </button>
                <button type="button" onclick="SaveLotteryTable()" 
                        style="padding: 6px 16px; border: none; background: #0d6efd; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer;">
                    儲存資料
                </button>
            </div>
        </div>
    `;

    var OpenWidth = parseInt(m_width.toUpperCase().replace("PX", "")) + "px";
    var m_themedCSS = {
        width: OpenWidth,
        top: '10%',
        left: 'calc(50% - ' + (parseInt(OpenWidth) / 2) + 'px)',
        boxSizing: 'border-box'
    };

    $.blockUI({
        onOverlayClick: $.unblockUI,
        overlayCSS: { backgroundColor: "#000", opacity: 0.4, cursor: "default" },
        theme: true,
        title: "維護統一發票中獎號碼",
        themedCSS: m_themedCSS,
        message: m_Html
    });

    // 暫存資料以供切換選單時回填
    window._cachedLatestYM = `${latestYYYY}-${latestMM}`;
    window._cachedLotteryList = currentLotteryList || [];
}

// 切換期別時：若是最新一期則回填資料，若是下一期則清空欄位
function onPeriodChange() {
    var selectedYM = document.getElementById("inp_period_select").value;
    
    if (selectedYM === window._cachedLatestYM) {
        // 切換到「修改最新期」：自動帶出該期號碼
        var list = window._cachedLotteryList;
        var spec1 = list.find(x => x.lottery_type === '特別獎')?.lottery_num || '';
        var spec2 = list.find(x => x.lottery_type === '特獎')?.lottery_num || '';
        var headList = list.filter(x => x.lottery_type === '頭獎').map(x => x.lottery_num);

        document.getElementById("inp_spec1").value = spec1;
        document.getElementById("inp_spec2").value = spec2;
        document.getElementById("inp_spec3_1").value = headList[0] || '';
        document.getElementById("inp_spec3_2").value = headList[1] || '';
        document.getElementById("inp_spec3_3").value = headList[2] || '';
    } else {
        // 切換到「新增下一期」：清空輸入欄位
        document.getElementById("inp_spec1").value = '';
        document.getElementById("inp_spec2").value = '';
        document.getElementById("inp_spec3_1").value = '';
        document.getElementById("inp_spec3_2").value = '';
        document.getElementById("inp_spec3_3").value = '';
    }
}

function SaveLotteryTable() {
    var periodVal = document.getElementById("inp_period_select").value; // 例: "2026-07"
    var parts = periodVal.split('-');
    var yyyy = parts[0];
    var mm = parts[1];

    var spec1 = document.getElementById("inp_spec1").value.trim();
    var spec2 = document.getElementById("inp_spec2").value.trim();
    var spec3_1 = document.getElementById("inp_spec3_1").value.trim();
    var spec3_2 = document.getElementById("inp_spec3_2").value.trim();
    var spec3_3 = document.getElementById("inp_spec3_3").value.trim();

    // 格式驗證：皆需 8 位數字
    var numRegex = /^\d{8}$/;
    if (!numRegex.test(spec1)) { alert("特別獎號碼需為 8 位數字！"); return; }
    if (!numRegex.test(spec2)) { alert("特獎號碼需為 8 位數字！"); return; }
    if (!numRegex.test(spec3_1) || !numRegex.test(spec3_2) || !numRegex.test(spec3_3)) {
        alert("頭獎 3 組號碼皆需為 8 位數字！");
        return;
    }

    var postData = [
        { lottery_yyyy: yyyy, lottery_mon: mm, lottery_type: "SPEC1", lottery_num: spec1 },
        { lottery_yyyy: yyyy, lottery_mon: mm, lottery_type: "SPEC2", lottery_num: spec2 },
        { lottery_yyyy: yyyy, lottery_mon: mm, lottery_type: "SPEC3", lottery_num: spec3_1 },
        { lottery_yyyy: yyyy, lottery_mon: mm, lottery_type: "SPEC3", lottery_num: spec3_2 },
        { lottery_yyyy: yyyy, lottery_mon: mm, lottery_type: "SPEC3", lottery_num: spec3_3 }
    ];

    var userNum = encodeURIComponent(typeof WebUser !== "undefined" ? WebUser : "");
    var url = `${BASE_URL}/AE_ACC/SaveLotteryTable?u_num=${userNum}`;

    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(postData)
    })
    .then(async res => {
        // 先讀取字串，避免 body 為空時 res.json() 報錯
        const text = await res.text();
        let data = {};
        
        try {
            data = text ? JSON.parse(text) : {};
        } catch (e) {
            console.error("後端回傳非 JSON 格式:", text);
        }

        // 判斷 HTTP 狀態與業務代碼
        if (res.ok && (data.ResultCode === "000" || data.resultCode === "000" || !data.ResultCode)) {
            alert("儲存成功！");
            location.reload();
        } else {
            const errorMsg = data.ResultMsg || data.ResultMessage || `HTTP ${res.status}: ${text || '無回傳訊息'}`;
            alert("儲存失敗：" + errorMsg);
        }
    })
    .catch(err => {
        console.error("儲存出錯:", err);
        alert("儲存過程發生錯誤！");
    });
}
	
	
</script>
