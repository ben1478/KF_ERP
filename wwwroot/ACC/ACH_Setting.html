    function loadItemDropdown1({ selectId, itemCode, onlock = null}) {
        const url = `${BASE_URL}/AE/GetItemList?item_M_code=${itemCode}`;

    function generateGetDateOptions(monthsToAdd = 0) {
        const select = document.getElementById("getDate");
        if (!select) return;
        select.innerHTML = '';

        const now = new Date();
        const startYear = now.getFullYear() - 1911;
        const startMonth = now.getMonth() + 1; 

        const endDate = new Date(now.getFullYear(), now.getMonth() + monthsToAdd, 1);
        const endYear = endDate.getFullYear() - 1911;
        const endMonth = endDate.getMonth() + 1;

        for (let y = startYear; y <= endYear; y++) {
            let mStart = (y === startYear) ? startMonth : 1;
            let mEnd = (y === endYear) ? endMonth : 12;
            
            for (let m = mStart; m <= mEnd; m++) {
                let monthStr = m.toString().padStart(2, '0');
                let dateText = `${y}-${monthStr}`;

                let opt = document.createElement('option');
                opt.value = `${y + 1911}-${monthStr}`; // 西元年給 API
                opt.innerHTML = dateText;              // 民國年給 User 看
                select.appendChild(opt);
            }
        }
    }

    function initCalendar() {
        if(!$("#getDate").val()) return;
        fetch(`${BASE_URL}/AE/GetCalendarByMonth?YYYYMM=${$("#getDate").val()}&Ach_Bank=${$("#ACH_BANK").val()}`)

        .then(result => {

					$("#btnExcel_New").hide();
				}
            }
        })
        .catch(err => {
            console.error("API 讀取異常", err);
        });
    }

    function formatDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}/${m}/${d}`; 
    }

   function renderTable(data) {
    const tbody = document.getElementById('calendarBody');
    tbody.innerHTML = '';
    const lblSumAMT = document.getElementById('lblSumAMT');
    const Ach_Bank = $("#ACH_BANK").val();
    
    if (!data || data.length === 0) {
        if (lblSumAMT) lblSumAMT.innerText = '0';
        return;
    }

    let html = '<tr class="trDate">';
    let totalMonthAmount = 0;

    const firstDayDate = new Date(data[0].DateValue);
    const firstDayOfWeek = firstDayDate.getDay(); 

    for (let i = 0; i < firstDayOfWeek; i++) {
        html += '<td class="holiday"></td>';
    }

    let cellCount = firstDayOfWeek;

    data.forEach((day) => {
        if (cellCount > 0 && cellCount % 7 === 0) {
            html += '</tr><tr>';
        }

        const d = new Date(day.DateValue);
        const dateStr = formatDate(d); 
        
        let classes = [];
        let tdAttributes = `data-date="${dateStr}"`; 

        const isWeekend = (d.getDay() === 0 || d.getDay() === 6);
        
        if (day.IsHoliday === 1 || isWeekend) {
            classes.push('holiday');
        } else {
            const yyyyMmDd = dateStr.replace(/\//g, '-'); 
            tdAttributes += ` onclick="GetSettingByDate('${yyyyMmDd}','${Ach_Bank}')"`;
        }

        if (dateStr === selectedDate) {
            classes.push('selected-date');
        }

        let amountHtml = '';
        if (day.RC_amount !== undefined && day.RC_amount !== null && day.IsHoliday === 0) {
            const amountNum = Number(day.RC_amount);
            if (!isNaN(amountNum)) {
                totalMonthAmount += amountNum;
            }
            const formattedAmount = amountNum.toLocaleString('en-US');
            amountHtml = `<div style="color: #2e7d32; font-weight: bold; margin-top: 10px; text-align: right;">$${formattedAmount}</div>`;
        }
        
        html += `
        <td class="${classes.join(' ')}" ${tdAttributes}>
            <div style="font-weight:bold; margin-bottom:4px;">${d.getDate()}</div>
            ${amountHtml}
        </td>`;

        cellCount++;
    });

    while (cellCount % 7 !== 0) {
        html += '<td class="holiday"></td>';
        cellCount++;
    }

    html += '</tr>';
    tbody.innerHTML = html;

    if (lblSumAMT) {
        lblSumAMT.innerText = totalMonthAmount.toLocaleString('en-US');
    }
}

function DownloadACHFile(launchDate, achBank) {
    const url = `${BASE_URL}/AE_RPT/GenerateACHFile?LaunchDate=${launchDate}&Ach_Bank=${achBank}`;

    fetch(url, {
        method: 'POST'
    })
    .then(response => {
        if (!response.ok) throw new Error('網路回應不成功');
        const contentType = response.headers.get("content-type");
        
        if (contentType && contentType.includes("application/json")) {
            return response.json().then(data => {
                if (data.success || data.Success) {
                    const fileName = data.fileName || data.FileName;
                    const base64Str = data.fileBase64 || data.FileBase64;
                    const byteCharacters = atob(base64Str);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: "application/zip" });
                    triggerBrowserDownload(blob, fileName);
                } else {
                    alert("產檔失敗：" + (data.resultMsg || "未知錯誤"));
                }
            });
        } else {
            let fileName = `${achBank}_ACH_${launchDate.replace(/\//g, '')}.txt`;
            const disposition = response.headers.get('content-disposition');
            if (disposition && disposition.indexOf('attachment') !== -1) {
                const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                const matches = filenameRegex.exec(disposition);
                if (matches != null && matches[1]) { 
                    fileName = matches[1].replace(/['"]/g, '');
                }
            }
            return response.blob().then(blob => {
                const textBlob = new Blob([blob], { type: "text/plain" });
                triggerBrowserDownload(textBlob, fileName);
            });
        }
    })
    .catch(error => {
        console.error('下載失敗:', error);
        alert('下載 ACH 檔案時發生錯誤: ' + error.message);
    });
}

function triggerBrowserDownload(blob, fileName) {
    const link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    window.URL.revokeObjectURL(link.href);
}

// 產生虛擬帳號與超商條碼功能
async function GenerateVirtualAccountAndBarcodes(rcdId, dueDate, amount, AchBank) {
    $.blockUI({ message: '資料載入中，請稍候...' });

    const isObank = AchBank === 'OBANK';
    const bankInfo = isObank ? BANK_CONFIG.OBANK : BANK_CONFIG.DEFAULT;

    const urlVA = `${BASE_URL}/AE/GenerateVirtualAccount?RCD_id=${rcdId}&ACH_BANK=${AchBank}`;
    const urlBarcodes = `${BASE_URL}/AE/GenerateSupermarketBarcodes?RCD_id=${rcdId}&dueDate=${dueDate}&amount=${amount}`;

    try {
        // 僅在 OBANK 時才去取條碼資料
        const requests = [fetch(urlVA).then(res => res.json())];
        if (isObank) {
            requests.push(fetch(urlBarcodes).then(res => res.json()));
        }

        const [vaRes, barcodeRes] = await Promise.all(requests);
        $.unblockUI();

        // 虛擬帳號驗證
        if (vaRes.resultCode !== "000") {
            alert("取得虛擬帳號失敗：" + (vaRes.resultMsg || "未知錯誤"));
            return;
        }

function addOneMonth(dueDate) {
    // 支援 Date 物件或 "YYYY-MM-DD" / "YYYY/MM/DD" 字串格式
    let date;
    if (typeof dueDate === 'string') {
        const parts = dueDate.split(/[-/]/);
        if (parts.length === 3) {
            // 注意：月份 index 從 0 開始 (0 = 1月)
            date = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        } else {
            date = new Date(dueDate);
        }
    } else {
        date = new Date(dueDate);
    }

    const currentDay = date.getDate();
    
    // 設定到目標月份（月份 + 1）的第 1 天，避免直接 setMonth 因天數溢位跳到下下個月
    // 例：1/31 直接 +1 個月可能因為 2 月沒 31 天而跳到 3 月
    date.setDate(1);
    date.setMonth(date.getMonth() + 1);

    // 取得目標月份的最大天數
    const daysInTargetMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();

    // 如果原日期超過目標月份天數，則取目標月份最後一天；否則維持原日期
    date.setDate(Math.min(currentDay, daysInTargetMonth));

    // 格式化輸出為 YYYY-MM-DD
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');

    return `${yyyy}-${mm}-${dd}`;
}


// 匯出條碼為圖片下載
function ExportBarcodesToImage(rcdId, dueDate, amount, virtualAccount, AchBank) {
    const isObank = (AchBank === 'OBANK');
    const bankConfig = isObank ? BANK_CONFIG.OBANK : BANK_CONFIG.DEFAULT;
    const finalDueDate = typeof addOneMonth === 'function' ? addOneMonth(dueDate) : dueDate;

    // 1. 若為 OBANK，檢查 DOM 中的 3 段條碼 SVG 是否已渲染完成
    const svgIds = ['#barcode1', '#barcode2', '#barcode3'];
    let svgs = [];
    if (isObank) {
        svgs = svgIds.map(id => document.querySelector(id));
        if (svgs.some(svg => !svg)) {
            alert("條碼尚未生成完成，請稍候再試。");
            return;
        }
    }

    // 2. 依銀行類型動態決定畫布尺寸 (非 OBANK 沒有條碼，高度大幅縮減)
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const canvasWidth = 560;
    const canvasHeight = isObank ? 750 : 265;
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    // 3. 繪製純白底色
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);

    // 4. 頂部大標題 (26px)
    ctx.fillStyle = '#1a237e';
    ctx.font = 'bold 26px "Microsoft JhengHei", Arial';
    ctx.textAlign = 'center';
    const mainTitle = isObank ? '繳款帳號與超商條碼單' : 'ATM 虛擬帳號繳款單';
    ctx.fillText(mainTitle, canvasWidth / 2, 45);

    // 5. ATM 虛擬帳號外框 (高度 170px，配合合併後的 4 行資訊)
    const boxX = 25;
    const boxY = 65;
    const boxW = canvasWidth - 50;
    const boxH = 185;

    ctx.fillStyle = '#eef5fc';
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = '#90caf9';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(boxX, boxY, boxW, boxH);

	if(isObank)
	{
		// ATM 區塊標題 (20px)
		ctx.textAlign = 'left';
		ctx.fillStyle = '#0d47a1';
		ctx.font = 'bold 20px "Microsoft JhengHei", Arial';
		ctx.fillText('【ATM 虛擬帳號資訊】', 40, 95);

		// 銀行代碼與分行代號（依 bankInfo 合併顯示）
		ctx.fillStyle = '#333333';
		ctx.font = 'bold 18px "Microsoft JhengHei", Arial';
		ctx.fillText(`銀行代碼：${bankConfig.code} ${bankConfig.branch}`, 40, 130);
	}
	else
	{
		// ATM 區塊標題 (20px)
		ctx.textAlign = 'left';
		ctx.fillStyle = '#0d47a1';
		ctx.font = 'bold 20px "Microsoft JhengHei", Arial';
		ctx.fillText(`【ATM 虛擬帳號資訊】`, 40, 95);

		ctx.textAlign = 'left';
		ctx.fillStyle = '#0d47a1';
		ctx.font = 'bold 20px "Microsoft JhengHei", Arial';
		ctx.fillText(`${bankConfig.branch}`, 40, 235);

		// 銀行代碼與分行代號（依 bankInfo 合併顯示）
		ctx.fillStyle = '#333333';
		ctx.font = 'bold 18px "Microsoft JhengHei", Arial';
		ctx.fillText(`銀行代碼：${bankConfig.code} `, 40, 135);
	}
    

    // 虛擬帳號（標籤 + 鮮明深紅色強調）
    ctx.fillText('虛擬帳號：', 40, 165);
    ctx.fillStyle = '#d32f2f';
    ctx.font = 'bold 22px Arial';
    ctx.fillText(virtualAccount || '', 130, 165);

    // 應繳金額與繳款期限
    ctx.fillStyle = '#333333';
    ctx.font = 'bold 18px "Microsoft JhengHei", Arial';
    ctx.fillText(`應繳金額：$${Number(amount).toLocaleString('en-US')} 元`, 40, 200);
    ctx.fillText(`繳款期限：${finalDueDate}`, 300, 200);

    // 觸發下載檔案共用邏輯
    const triggerDownload = () => {
        const link = document.createElement('a');
        const sanitizedDate = String(finalDueDate).replace(/[-/]/g, '');
        link.download = `繳款單_${rcdId}_${sanitizedDate}.png`;
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    // 6. 若非 OBANK，繪製完 ATM 資訊後直接匯出檔案
    if (!isObank) {
        triggerDownload();
        return;
    }

    // 7. 若為 OBANK，繼續繪製超商代收條碼
    ctx.fillStyle = '#333333';
    ctx.font = 'bold 20px "Microsoft JhengHei", Arial';
    ctx.fillText('【超商代收條碼】', 40, 275);

    // 將 SVG 轉成 Image 物件以供 Canvas 繪製
    const svgToImage = (svgElement) => {
        return new Promise((resolve, reject) => {
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                resolve(img);
            };
            img.onerror = reject;
            img.src = url;
        });
    };

    Promise.all(svgs.map(svg => svgToImage(svg)))
        .then(images => {
            const startY = 290;
            const stepY = 145;
            const labels = ['第一段條碼', '第二段條碼', '第三段條碼'];

            images.forEach((img, index) => {
                const curY = startY + (index * stepY);

                // 條碼段別標籤
                ctx.fillStyle = '#666666';
                ctx.font = 'bold 16px "Microsoft JhengHei", Arial';
                ctx.textAlign = 'center';
                ctx.fillText(labels[index], canvasWidth / 2, curY + 16);

                // 條碼圖片置中繪製
                const imgX = (canvasWidth - img.width) / 2;
                ctx.drawImage(img, imgX, curY + 24);
            });

            triggerDownload();
        })
        .catch(err => {
            console.error("繳款單條碼圖片產生失敗", err);
            alert("匯出圖片失敗，請稍候再試。");
        });
}

function convertToROCDate(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if(parts.length < 3) return dateStr;
    const rocYear = parseInt(parts[0], 10) - 1911;
    return `${rocYear}-${parts[1]}-${parts[2]}`;
}
