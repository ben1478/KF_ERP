<script>
	const Params = getQueryParams();
    let WebUser = Params.WebUser;
    let WebBC = Params.WebBC;

    const itemsPerPage = 20;  
    let currentPage = 1;
    let data = []; 

	window.onload = function () {
		loadYYYYY();	
	}

	
	

	function loadYYYYY() {
		// 1. 取得系統當前的西元年份
		  const currentYear = new Date().getFullYear();

		  // 2. 抓取 HTML 中的 select 元素
		  const selectElement = document.getElementById('YYYY');

		  // 3. 設定要產生的 3 個西元年份
		  const years = [ currentYear - 1, currentYear ];

		  // 4. 動態建立選單
		  years.forEach(year => {
			const option = document.createElement('option');
			
			// value 依然維持西元年 (例如: 2026)
			option.value = year; 

			// textContent 改顯示民國年 (例如: 民國 115 年)
			const minguoYear = year - 1911;
			option.textContent = `${minguoYear} 年`;

			// 預設選取今年
			if (year === currentYear) {
			  option.selected = true;
			}

			selectElement.appendChild(option);
		  });
    }

    function fetchData() {
        let YYYY = document.getElementById('YYYY').value
		let Area = document.getElementById('Area').value
        const url = `${BASE_URL}/AE_FT/GetBonusReport?YYYY=${YYYY}&Area=${Area}`;
		if(Area=="North")
		{
			document.getElementById('Loc1_Amt').innerHTML="台北";
			document.getElementById('Loc2_Amt').innerHTML="新北";
			document.getElementById('Loc3_Amt').innerHTML="桃園";
		}
		else
		{
			document.getElementById('Loc1_Amt').innerHTML="台中";
			document.getElementById('Loc2_Amt').innerHTML="台南";
			document.getElementById('Loc3_Amt').innerHTML="高雄";
		}
        fetch(url, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        })
            .then(response => response.json())
            .then(responseData => {
                if (responseData.resultCode == "000") {
                    data = JSON.parse(responseData.objResult);
                    showPage(currentPage);
                    createPagination();
                } else {
                    alert(response.resultMsg);
                }
            })
            .catch(error => {
				console.log(`API 請求失敗: error=${error}`);
                alert('API 請求失敗:', error);
            });
    }

   
	function showPage(page) {
        const tbody = document.querySelector('#MainTable tbody');
        tbody.innerHTML = '';

        const startIndex = (page - 1) * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, data.length);
        const pageData = data.slice(startIndex, endIndex);
		

        for (let item of pageData) {
            const row = document.createElement('tr');
            row.setAttribute('align', 'center');
            row.setAttribute('class', 'c12-k');
            row.setAttribute('bgcolor', '#FFFFFF');
            row.setAttribute('onmouseover', "this.style.background='#FCFCC0';");
            row.setAttribute('onmouseout', "this.style.background='#FFFFFF';");

            const columnOrder = ['DisMM', 'Loc1_Amt', 'Loc2_Amt', 'Loc3_Amt', 'TotalAmt','BaseRate','BonusAmt','BonusFormula'];
			
			const serialCell = document.createElement('td');
            serialCell.textContent = startIndex + pageData.indexOf(item) + 1;
            row.appendChild(serialCell);
            
			for (let key of columnOrder) {
                const cell = document.createElement('td');
                switch (key) {
					case 'BonusFormula':
						cell.innerHTML = item[key].replace(/\r?\n/g, "<br>");
						cell.style.textAlign = 'left';
                        row.appendChild(cell);
						break;
					
                    default:
                        cell.textContent = item[key] || '';
                        row.appendChild(cell);
                }
            }
            
            tbody.appendChild(row);
        }
    }

	function getCurrentDateTime() {
      var currentDate = new Date();

      var year = currentDate.getFullYear();
      var month = ('0' + (currentDate.getMonth() + 1)).slice(-2);
      var day = ('0' + currentDate.getDate()).slice(-2);
      var hours = ('0' + currentDate.getHours()).slice(-2);
      var minutes = ('0' + currentDate.getMinutes()).slice(-2);

      var formattedDateTime = year + month + day + hours + minutes;
      return formattedDateTime;
    }

	function exportToExcel() {

		let DateS = document.getElementById('RC_dateS').value
		let DateE = document.getElementById('RC_dateE').value
        const url = `${BASE_URL}/AE_ACC/RC_Repay_Excel?DateS=${DateS}&DateE=${DateE}`;
		
        $.ajax({
            url: url,
            method: 'POST',
            xhrFields: {
                responseType: 'blob'
            },
            contentType: 'application/json',
            success: function (response) {
                const url = window.URL.createObjectURL(response);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `應收帳款-本金餘額表-${getCurrentDateTime()}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            },
            error: function (err) {
                alert('Error generating file');
            }
        });
    }

	
	
</script>
